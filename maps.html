<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS | Pariksa Disaster Risk Mapping</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Color Variables */
        :root {
            --primary-red: #E53935;
            --dark-red: #B71C1C;
            --bg-white: #FFFFFF;
            --bg-sidebar: #F8F9FA;
            --bg-dark: #0A192F;
            --text-primary: #1A1A1A;
            --text-secondary: #6B6B6B;
            --border-color: #EAEAEA;
            --font-main: 'Inter', sans-serif;

            /* Classification Colors */
            --color-high: #d32f2f;
            --color-moderate: #fbc02d;
            --color-low: #388e3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-main); color: var(--text-primary); overflow: hidden; }
        a { text-decoration: none; color: inherit; }

        /* --- Navbar --- */
        nav { position: fixed; top: 0; width: 100%; z-index: 2000; background-color: rgba(0, 0, 0, 0.95); padding: 0.8rem 0; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 95%; width: 100%; margin: 0 auto; }
        .logo-wrapper { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 700; color: #FFFFFF; }
        .logo-wrapper span { color: var(--primary-red); }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { font-weight: 600; font-size: 0.95rem; color: #FFFFFF; transition: color 0.2s ease; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-red) !important; }

        /* --- Layout --- */
        .webgis-container { display: flex; height: 100vh; padding-top: 60px; }

        .sidebar {
            width: 350px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            overflow-y: auto;
            box-shadow: 2px 0 15px rgba(0,0,0,0.03);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel-title { font-size: 1.1rem; font-weight: 700; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-label { font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }

        .custom-select {
            width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color);
            font-family: var(--font-main); font-size: 0.95rem; color: var(--text-primary);
            background-color: white; cursor: pointer; outline: none; appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em;
        }
        .custom-select:focus { border-color: var(--primary-red); }

        /* --- Radio Button Styling --- */
        .radio-grid { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
        .radio-item { position: relative; }
        .radio-input { display: none; }
        .radio-label {
            display: flex; align-items: center; padding: 0.7rem 1rem;
            border: 1px solid var(--border-color); border-radius: 8px;
            background: white; cursor: pointer; font-size: 0.9rem; transition: 0.2s;
        }
        .radio-input:checked + .radio-label {
            border-color: var(--primary-red); background: rgba(229, 57, 53, 0.05); color: var(--primary-red); font-weight: 600;
        }

        .btn-apply {
            margin-top: 0.5rem; width: 100%; padding: 1rem;
            background-color: var(--primary-red); color: white;
            border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-apply:hover { background-color: var(--dark-red); }

        /* --- Sidebar Legend --- */
        .sidebar-legend {
            margin-top: 1rem;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
        }
        .legend-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.8rem; color: var(--text-primary); text-transform: uppercase; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-secondary); font-weight: 500;}
        .legend-item:last-child { margin-bottom: 0; }
        
        .color-dot { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
        .dot-high { background-color: var(--color-high); }
        .dot-moderate { background-color: var(--color-moderate); }
        .dot-low { background-color: var(--color-low); }

        .map-area { flex-grow: 1; position: relative; }
        #map { width: 100%; height: 100%; }

        /* Toast Notification */
        .toast {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background-color: var(--bg-dark); color: white;
            padding: 1rem 1.5rem; border-radius: 8px; font-size: 0.9rem; font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .toast.show { transform: translateX(0); }

        @media (max-width: 768px) {
            .webgis-container { flex-direction: column; }
            .sidebar { width: 100%; height: 50vh; border-right: none; border-top: 1px solid var(--border-color); order: 2; }
            .map-area { height: 50vh; order: 1;}
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo-wrapper">Pariksa<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="guide.html">Guide</a></li>
                <li><a href="maps.html" class="active">Maps</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="team.html">Team</a></li>
            </ul>
        </div>
    </nav>

    <div class="webgis-container">
        <aside class="sidebar">
            <div class="panel-title">Control Panel</div>

            <div class="form-group">
                <label class="form-label">1. Select District</label>
                <select id="district-select" class="custom-select">
                    <option value="" disabled selected>-- Choose District --</option>
                    <option value="Andir">Andir</option>
                    <option value="Antapani">Antapani</option>
                    <option value="Arcamanik">Arcamanik</option>
                    <option value="Astana Anyar">Astana Anyar</option>
                    <option value="Babakan Ciparay">Babakan Ciparay</option>
                    <option value="Bandung Kidul">Bandung Kidul</option>
                    <option value="Bandung Kulon">Bandung Kulon</option>
                    <option value="Bandung Wetan">Bandung Wetan</option>
                    <option value="Batununggal">Batununggal</option>
                    <option value="Bojongloa Kaler">Bojongloa Kaler</option>
                    <option value="Bojongloa Kidul">Bojongloa Kidul</option>
                    <option value="Buahbatu">Buahbatu</option>
                    <option value="Cibeunying Kaler">Cibeunying Kaler</option>
                    <option value="Cibeunying Kidul">Cibeunying Kidul</option>
                    <option value="Cibiru">Cibiru</option>
                    <option value="Cicendo">Cicendo</option>
                    <option value="Cidadap">Cidadap</option>
                    <option value="Cinambo">Cinambo</option>
                    <option value="Coblong">Coblong</option>
                    <option value="Gedebage">Gedebage</option>
                    <option value="Kiaracondong">Kiaracondong</option>
                    <option value="Lengkong">Lengkong</option>
                    <option value="Mandalajati">Mandalajati</option>
                    <option value="Panyileukan">Panyileukan</option>
                    <option value="Rancasari">Rancasari</option>
                    <option value="Regol">Regol</option>
                    <option value="Sukajadi">Sukajadi</option>
                    <option value="Sukasari">Sukasari</option>
                    <option value="Sumur Bandung">Sumur Bandung</option>
                    <option value="Ujungberung">Ujungberung</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">2. Hazard Type</label>
                <select id="hazard-select" class="custom-select">
                    <option value="earthquake">Earthquake</option>
                    <option value="flood">Flood</option>
                    <option value="landslide">Landslide</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">3. Analysis Parameter</label>
                <div class="radio-grid">
                    <div class="radio-item">
                        <input type="radio" name="parameter" value="risk" id="p1" class="radio-input" checked>
                        <label for="p1" class="radio-label">Risk (Parcel-Based Vektor)</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" name="parameter" value="hazard" id="p2" class="radio-input">
                        <label for="p2" class="radio-label">Hazard Level</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" name="parameter" value="vulnerability" id="p3" class="radio-input">
                        <label for="p3" class="radio-label">Vulnerability</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" name="parameter" value="capacity" id="p4" class="radio-input">
                        <label for="p4" class="radio-label">Capacity</label>
                    </div>
                </div>
            </div>

            <button class="btn-apply" onclick="applyMapFilter()">Apply & Render Map</button>

            <div class="sidebar-legend">
                <div class="legend-title">Risk Level Indicators</div>
                <div class="legend-item"><span class="color-dot dot-high"></span> High</div>
                <div class="legend-item"><span class="color-dot dot-moderate"></span> Moderate</div>
                <div class="legend-item"><span class="color-dot dot-low"></span> Low</div>
            </div>

        </aside>

        <main class="map-area">
            <div id="map"></div>
            <div id="toastNotif" class="toast">Loading spatial data...</div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==========================================
        // 1. INITIAL MAP SETUP
        // ==========================================
        const defaultCenter = [-6.9147, 107.6098]; // Bandung City Center
        const defaultZoom = 13;

        const map = L.map('map', { zoomControl: false }).setView(defaultCenter, defaultZoom);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap, CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        let currentWmsLayer = null;

        // ==========================================
        // 2. GEOSERVER CONFIGURATION
        // ==========================================
        const geoserverUrl = 'http://localhost:8080/geoserver/pariksa/wms';
        const workspace = 'pariksa';

        // ==========================================
        // 3. DISTRICT (KECAMATAN) SPATIAL DATABASE
        // ==========================================
        const districtData = {
            "andir": { center: [-6.9149, 107.5786], zoom: 15 },
            "antapani": { center: [-6.9168, 107.6534], zoom: 15 },
            "arcamanik": { center: [-6.9143, 107.6749], zoom: 15 },
            "astana_anyar": { center: [-6.9319, 107.5952], zoom: 15 },
            "babakan_ciparay": { center: [-6.9385, 107.5746], zoom: 15 },
            "bandung_kidul": { center: [-6.9582, 107.6258], zoom: 15 },
            "bandung_kulon": { center: [-6.9248, 107.5623], zoom: 15 },
            "bandung_wetan": { center: [-6.9038, 107.6166], zoom: 15 },
            "batununggal": { center: [-6.9304, 107.6272], zoom: 15 },
            "bojongloa_kaler": { center: [-6.9366, 107.5888], zoom: 15 },
            "bojongloa_kidul": { center: [-6.9538, 107.5959], zoom: 15 },
            "buahbatu": { center: [-6.9531, 107.6436], zoom: 15 },
            "cibeunying_kaler": { center: [-6.8887, 107.6267], zoom: 15 },
            "cibeunying_kidul": { center: [-6.9042, 107.6366], zoom: 15 },
            "cibiru": { center: [-6.9292, 107.7247], zoom: 15 },
            "cicendo": { center: [-6.9044, 107.5925], zoom: 15 },
            "cidadap": { center: [-6.8711, 107.6033], zoom: 15 },
            "cinambo": { center: [-6.9361, 107.6881], zoom: 15 },
            "coblong": { center: [-6.8841, 107.6133], zoom: 15 },
            "gedebage": { center: [-6.9458, 107.6853], zoom: 15 },
            "kiaracondong": { center: [-6.9261, 107.6425], zoom: 15 },
            "lengkong": { center: [-6.9318, 107.6186], zoom: 15 },
            "mandalajati": { center: [-6.9036, 107.6711], zoom: 15 },
            "panyileukan": { center: [-6.9366, 107.7058], zoom: 15 },
            "rancasari": { center: [-6.9511, 107.6653], zoom: 15 },
            "regol": { center: [-6.9355, 107.6067], zoom: 15 },
            "sukajadi": { center: [-6.8833, 107.5925], zoom: 15 },
            "sukasari": { center: [-6.8683, 107.5858], zoom: 15 },
            "sumur_bandung": { center: [-6.9152, 107.6111], zoom: 15 },
            "ujungberung": { center: [-6.9158, 107.6975], zoom: 15 }
        };

        // ==========================================
        // 4. MAIN FILTER CONTROLLER
        // ==========================================
        function applyMapFilter() {
            const rawDistrict = document.getElementById('district-select').value;
            const hazard = document.getElementById('hazard-select').value; 
            const parameter = document.querySelector('input[name="parameter"]:checked').value; 

            // Cek jika Risk dipilih tapi kecamatan belum dipilih
            if (parameter === 'risk' && !rawDistrict) {
                showNotification("Please select a district from the dropdown.");
                return;
            }

            let layerName = "";
            let formattedDistrict = "";
            
            if (rawDistrict) {
                formattedDistrict = rawDistrict.toLowerCase().replace(/\s+/g, '_');
            }

            // Logic Pembentukan Nama Layer
            if (parameter === 'risk') {
                layerName = `risk_${formattedDistrict}_${hazard}`;
            } else {
                layerName = `${parameter}_${hazard}`;
            }

            console.log(`Requesting Data: ${workspace}:${layerName}`);
            
            // Panggil Layer
            if (currentWmsLayer) { map.removeLayer(currentWmsLayer); }
            currentWmsLayer = L.tileLayer.wms(geoserverUrl, {
                layers: `${workspace}:${layerName}`, 
                format: 'image/png',
                transparent: true,
                version: '1.1.0',
                styles: '', 
                attribution: "Pariksa WebGIS"
            });
            currentWmsLayer.addTo(map);

            // Pergerakan Kamera (FlyTo)
            if (parameter === 'risk' && formattedDistrict && districtData[formattedDistrict]) {
                const target = districtData[formattedDistrict];
                map.flyTo(target.center, target.zoom, { animate: true, duration: 1.5 });
            } else {
                map.flyTo(defaultCenter, defaultZoom, { animate: true, duration: 1.5 });
            }

            showNotification(`Loading ${parameter} spatial data...`);
        }

        // ==========================================
        // 5. UI NOTIFICATION
        // ==========================================
        function showNotification(message) {
            const toast = document.getElementById('toastNotif');
            if (toast) {
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 3000);
            }
        }
    </script>
</body>
</html>
