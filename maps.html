<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps | Pariksa Disaster Risk Mapping</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary-red: #E53935;
            --bg-white: #FFFFFF;
            --bg-sidebar: #F8F9FA;
            --text-primary: #1A1A1A;
            --text-secondary: #6B6B6B;
            --border-color: #EAEAEA;
            --font-main: 'Inter', sans-serif;
            --color-high: #d32f2f;
            --color-moderate: #fbc02d;
            --color-low: #388e3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-main); color: var(--text-primary); overflow: hidden; }
        a { text-decoration: none; color: inherit; }

        nav { 
            position: fixed; top: 0; width: 100%; height: 60px;
            background-color: var(--bg-white); border-bottom: 1px solid var(--border-color);
            z-index: 2000; display: flex; align-items: center; padding: 0 2rem;
        }
        
        .nav-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo-wrapper { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; }
        
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); }
        .nav-links a.active { color: var(--primary-red); }

        .webgis-container { display: flex; height: 100vh; padding-top: 60px; }

        .sidebar {
            width: 350px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color);
            padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;
        }

        .panel-title { font-size: 1.1rem; font-weight: 700; border-bottom: 2px solid var(--border-color); padding-bottom: 0.8rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-label { font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }

        .custom-select {
            width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); 
            background-color: var(--bg-white); outline: none;
        }

        .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .radio-label {
            display: flex; align-items: center; justify-content: center; padding: 0.6rem; 
            border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-white); cursor: pointer;
        }
        .radio-input { display: none; }
        .radio-input:checked + .radio-label { background-color: rgba(229, 57, 53, 0.1); border-color: var(--primary-red); color: var(--primary-red); font-weight: 700; }

        .btn-apply {
            margin-top: 1rem; width: 100%; padding: 1rem; background-color: var(--primary-red); color: white;
            border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
        }

        .map-area { flex-grow: 1; position: relative; }
        #map { width: 100%; height: 100%; }

        .map-legend {
            position: absolute; bottom: 30px; left: 20px; z-index: 1000;
            background-color: rgba(255, 255, 255, 0.95); padding: 1rem; border-radius: 8px;
            border: 1px solid var(--border-color); min-width: 200px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo-wrapper">Pariksa</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="maps.html" class="active">Maps</a></li>
            </ul>
        </div>
    </nav>

    <div class="webgis-container">
        <aside class="sidebar">
            <div class="panel-title">Map Layer Controls</div>

            <div class="form-group">
                <label class="form-label">1. Hazard Type</label>
                <select id="hazard-select" class="custom-select">
                    <option value="longsor" selected>Landslide</option>
                    <option value="banjir">Flood</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">2. Analysis Parameter</label>
                <div class="radio-grid">
                    <label>
                        <input type="radio" name="parameter" value="risiko" class="radio-input">
                        <div class="radio-label">Risk (R)</div>
                    </label>
                    <label>
                        <input type="radio" name="parameter" value="bahaya" class="radio-input" checked>
                        <div class="radio-label">Hazard (H)</div>
                    </label>
                </div>
            </div>

            <button class="btn-apply" onclick="applyFilter()">Render Map</button>
        </aside>

        <main class="map-area">
            <div id="map"></div>
            <div class="map-legend">
                <div id="legend-title" style="font-weight:700; font-size:0.9rem; margin-bottom:0.5rem;">Landslide Map</div>
                <div style="font-size:0.8rem; color:var(--text-secondary);">Style: Standard (Full Colors)</div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([-6.9147, 107.6098], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        let currentWmsLayer = null;
        const geoserverUrl = 'http://localhost:8080/geoserver/pariksa/wms';

        function addWmsLayer(layerName) {
            if (currentWmsLayer) map.removeLayer(currentWmsLayer);
            
            currentWmsLayer = L.tileLayer.wms(geoserverUrl, {
                layers: `pariksa:${layerName}`,
                styles: 'style_semua', // Menggunakan satu style standar untuk semua
                format: 'image/png',
                transparent: true,
                version: '1.1.0'
            });
            currentWmsLayer.addTo(map);
        }

        function applyFilter() {
            const hazard = document.getElementById('hazard-select').value;
            const parameter = document.querySelector('input[name="parameter"]:checked').value;

            let layerName = "";
            if (parameter === "bahaya" && hazard === "longsor") {
                layerName = "bahayalongsor";
            } else if (parameter === "risiko" && hazard === "longsor") {
                layerName = "RisikoLongsorPersil";
            } else {
                layerName = parameter + hazard;
            }

            addWmsLayer(layerName);
            document.getElementById('legend-title').textContent = `${hazard.toUpperCase()} ${parameter.toUpperCase()} Map`;
        }
    </script>
</body>
</html>
