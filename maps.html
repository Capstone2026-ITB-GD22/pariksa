<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS | Pariksa Disaster Risk Mapping</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Color Variables */
        :root {
            --primary-red: #E53935;
            --dark-red: #B71C1C;
            --bg-white: #FFFFFF;
            --bg-sidebar: #F8F9FA;
            --bg-dark: #0A192F;
            --text-primary: #1A1A1A;
            --text-secondary: #6B6B6B;
            --border-color: #EAEAEA;
            --font-main: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-main); color: var(--text-primary); overflow: hidden; }
        a { text-decoration: none; color: inherit; }

        /* Minimalist Navbar */
        nav { 
            position: fixed; top: 0; width: 100%; z-index: 2000;
            background-color: rgba(0, 0, 0, 0.95);
            padding: 0.8rem 0;
        }
        .nav-container { 
            display: flex; justify-content: space-between; align-items: center; 
            max-width: 95% !important; width: 100%; margin: 0 auto;
        }
        .logo-wrapper { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 700; color: #FFFFFF; }
        .logo-img { height: 40px; width: auto; }
        .logo-wrapper span { color: var(--primary-red); }
        
        .nav-right { display: flex; align-items: center; gap: 2.5rem; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { font-weight: 600; font-size: 0.95rem; color: #FFFFFF; transition: color 0.2s ease; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-red) !important; }
        
        /* Main Layout */
        .webgis-container {
            display: flex;
            height: 100vh;
            padding-top: 60px;
        }

        /* Sidebar Control Panel */
        .sidebar {
            width: 350px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            overflow-y: auto;
            box-shadow: 2px 0 15px rgba(0,0,0,0.03);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-label { font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }

        /* Search & Select Input */
        .custom-input, .custom-select {
            width: 100%; padding: 0.8rem; border-radius: 8px;
            border: 1px solid var(--border-color); font-family: var(--font-main);
            font-size: 0.95rem; color: var(--text-primary); background-color: var(--bg-white);
            outline: none;
        }
        .custom-select {
            cursor: pointer; appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em;
        }
        .custom-input:focus, .custom-select:focus { border-color: var(--primary-red); }

        /* Parameter Radio Buttons */
        .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .radio-label {
            display: flex; align-items: center; justify-content: center;
            padding: 0.6rem; border: 1px solid var(--border-color);
            border-radius: 8px; background-color: var(--bg-white);
            cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s ease;
        }
        .radio-input { display: none; }
        .radio-input:checked + .radio-label {
            background-color: rgba(229, 57, 53, 0.1);
            border-color: var(--primary-red);
            color: var(--primary-red);
            font-weight: 700;
        }

        /* Apply Button */
        .btn-apply {
            margin-top: 1rem; width: 100%; padding: 1rem;
            background-color: var(--primary-red); color: white;
            border: none; border-radius: 8px; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: background-color 0.3s ease; font-family: var(--font-main);
        }
        .btn-apply:hover { background-color: var(--dark-red); }

        /* Map Area */
        .map-area { flex-grow: 1; position: relative; }
        #map { width: 100%; height: 100%; background-color: #e5e5e5; }

        /* Toast Notification */
        .toast {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background-color: var(--bg-dark); color: white;
            padding: 1rem 1.5rem; border-radius: 8px; font-size: 0.9rem; font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .toast.show { transform: translateX(0); }

        @media (max-width: 768px) {
            .webgis-container { flex-direction: column; }
            .sidebar { width: 100%; height: 50vh; order: 2; border-right: none; border-top: 1px solid var(--border-color); }
            .map-area { height: 50vh; order: 1; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo-wrapper">
                <img src="LOGO.png" alt="Pariksa Logo" class="logo-img" onerror="this.style.display='none'"> 
                Pariksa
            </a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="guide.html">Guide</a></li>
                    <li><a href="maps.html" class="active">Maps</a></li>
                    <li><a href="education.html">Education</a></li>
                    <li><a href="team.html">Team</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="webgis-container">
        
        <aside class="sidebar">
            <div class="panel-title">Map Layer Controls</div>

            <div class="form-group">
                <label class="form-label">1. Select District</label>
                <input type="text" id="district-search" class="custom-input" list="districts" placeholder="Search district...">
                <datalist id="districts">
                    <option value="Andir">
                    <option value="Astana Anyar">
                    <option value="Antapani">
                    <option value="Arcamanik">
                    <option value="Babakan Ciparay">
                    <option value="Bandung Kidul">
                    <option value="Bandung Kulon">
                    <option value="Bandung Wetan">
                    <option value="Batununggal">
                    <option value="Bojongloa Kaler">
                    <option value="Bojongloa Kidul">
                    <option value="Buahbatu">
                    <option value="Cibeunying Kaler">
                    <option value="Cibeunying Kidul">
                    <option value="Cibiru">
                    <option value="Cicendo">
                    <option value="Cidadap">
                    <option value="Cinambo">
                    <option value="Coblong">
                    <option value="Gedebage">
                    <option value="Kiaracondong">
                    <option value="Lengkong">
                    <option value="Mandalajati">
                    <option value="Panyileukan">
                    <option value="Rancasari">
                    <option value="Regol">
                    <option value="Sukajadi">
                    <option value="Sukasari">
                    <option value="Sumur Bandung">
                    <option value="Ujungberung">
                </datalist>
            </div>

            <div class="form-group">
                <label class="form-label">2. Hazard Type</label>
                <select id="hazard-select" class="custom-select">
                    <option value="earthquake">Earthquake</option>
                    <option value="flood">Flood</option>
                    <option value="landslide">Landslide</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">3. Analysis Parameter</label>
                <div class="radio-grid">
                    <label>
                        <input type="radio" name="parameter" value="risk" class="radio-input" checked>
                        <div class="radio-label">Risk (R)</div>
                    </label>
                    <label>
                        <input type="radio" name="parameter" value="hazard" class="radio-input">
                        <div class="radio-label">Hazard (H)</div>
                    </label>
                    <label>
                        <input type="radio" name="parameter" value="vulnerability" class="radio-input">
                        <div class="radio-label">Vulnerability (V)</div>
                    </label>
                    <label>
                        <input type="radio" name="parameter" value="capacity" class="radio-input">
                        <div class="radio-label">Capacity (C)</div>
                    </label>
                </div>
            </div>

            <button class="btn-apply" onclick="applyFilter()">Render Map</button>
        </aside>

        <main class="map-area">
            <div id="map"></div>
            <div id="toastNotif" class="toast">Loading spatial data...</div>
        </main>
    </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Koordinat Pusat & Inisialisasi Peta
        const defaultCenter = [-6.9147, 107.6098]; // Bandung City Center
        const defaultZoom = 13;

        const map = L.map('map', {
            zoomControl: false 
        }).setView(defaultCenter, defaultZoom);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        let currentWmsLayer = null;

        // 2. GeoServer Configuration
        const geoserverUrl = 'http://localhost:8080/geoserver/pariksa/wms';
        const workspace = 'pariksa';

        // 3. Database Koordinat 30 Kecamatan (Digunakan untuk FlyTo)
        const districtData = {
            "andir": { center: [-6.9149, 107.5786], zoom: 15 },
            "antapani": { center: [-6.9168, 107.6534], zoom: 15 },
            "arcamanik": { center: [-6.9143, 107.6749], zoom: 15 },
            "astana_anyar": { center: [-6.9319, 107.5952], zoom: 15 },
            "babakan_ciparay": { center: [-6.9385, 107.5746], zoom: 15 },
            "bandung_kidul": { center: [-6.9582, 107.6258], zoom: 15 },
            "bandung_kulon": { center: [-6.9248, 107.5623], zoom: 15 },
            "bandung_wetan": { center: [-6.9038, 107.6166], zoom: 15 },
            "batununggal": { center: [-6.9304, 107.6272], zoom: 15 },
            "bojongloa_kaler": { center: [-6.9366, 107.5888], zoom: 15 },
            "bojongloa_kidul": { center: [-6.9538, 107.5959], zoom: 15 },
            "buahbatu": { center: [-6.9531, 107.6436], zoom: 15 },
            "cibeunying_kaler": { center: [-6.8887, 107.6267], zoom: 15 },
            "cibeunying_kidul": { center: [-6.9042, 107.6366], zoom: 15 },
            "cibiru": { center: [-6.9292, 107.7247], zoom: 15 },
            "cicendo": { center: [-6.9044, 107.5925], zoom: 15 },
            "cidadap": { center: [-6.8711, 107.6033], zoom: 15 },
            "cinambo": { center: [-6.9361, 107.6881], zoom: 15 },
            "coblong": { center: [-6.8841, 107.6133], zoom: 15 },
            "gedebage": { center: [-6.9458, 107.6853], zoom: 15 },
            "kiaracondong": { center: [-6.9261, 107.6425], zoom: 15 },
            "lengkong": { center: [-6.9318, 107.6186], zoom: 15 },
            "mandalajati": { center: [-6.9036, 107.6711], zoom: 15 },
            "panyileukan": { center: [-6.9366, 107.7058], zoom: 15 },
            "rancasari": { center: [-6.9511, 107.6653], zoom: 15 },
            "regol": { center: [-6.9355, 107.6067], zoom: 15 },
            "sukajadi": { center: [-6.8833, 107.5925], zoom: 15 },
            "sukasari": { center: [-6.8683, 107.5858], zoom: 15 },
            "sumur_bandung": { center: [-6.9152, 107.6111], zoom: 15 },
            "ujungberung": { center: [-6.9158, 107.6975], zoom: 15 }
        };

        // 4. Layer Request Function
        function addWmsLayer(layerName) {
            if (currentWmsLayer) {
                map.removeLayer(currentWmsLayer);
            }

            currentWmsLayer = L.tileLayer.wms(geoserverUrl, {
                layers: `${workspace}:${layerName}`, 
                format: 'image/png',
                transparent: true,
                version: '1.1.0',
                styles: '', 
                attribution: "Pariksa"
            });
            
            currentWmsLayer.addTo(map);
        }

        // 5. Main Filter Logic
        function applyFilter() {
            // A. Ambil nilai dari HTML
            const rawDistrict = document.getElementById('district-search').value;
            const hazard = document.getElementById('hazard-select').value; 
            const parameter = document.querySelector('input[name="parameter"]:checked').value; 

            // Validasi Input Kecamatan jika Parameter = Risk
            if (parameter === 'risk' && !rawDistrict) {
                showNotification("Please select a district for Risk Mapping.");
                return;
            }

            let layerName = "";
            const formattedDistrict = rawDistrict.toLowerCase().replace(/\s+/g, '_');

            // B. Logika GeoServer (Pembagian Format Nama Layer)
            if (parameter === 'risk') {
                // Memanggil layer Vektor per Kecamatan (Contoh: risk_andir_earthquake)
                if (districtData[formattedDistrict]) {
                    layerName = `risk_${formattedDistrict}_${hazard}`;
                    // Pindah kamera ke tengah kecamatan
                    const target = districtData[formattedDistrict];
                    map.flyTo(target.center, target.zoom, { animate: true, duration: 1.5 });
                } else {
                    showNotification("District not found in database.");
                    return;
                }
            } else {
                // Memanggil layer General (H/V/C) se-Bandung Raya (Contoh: hazard_flood)
                layerName = `${parameter}_${hazard}`;
                // Pindah kamera zoom-out ke seluruh kota
                map.flyTo(defaultCenter, defaultZoom, { animate: true, duration: 1.5 });
            }

            // Eksekusi pemanggilan layer
            addWmsLayer(layerName);
            showNotification(`Loading ${parameter} data...`);
        }

        function showNotification(message) {
            const toast = document.getElementById('toastNotif');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
